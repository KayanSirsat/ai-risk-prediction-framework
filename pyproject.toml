[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-prediction-framework"
version = "2.1.0"
description = "AI-Driven Risk Prediction and Mitigation Framework — XGBoost, SHAP, Prophet, Isolation Forest, NLP, GenAI, Jira OAuth"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Risk AI Team", email = "team@riskframework.io"}
]
license = {text = "MIT"}
keywords = ["risk-prediction", "machine-learning", "forecasting", "anomaly-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "xgboost==2.1.4",
    "prophet>=1.1.5",
    "shap>=0.44.0",
    "spacy>=3.7.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "mypy",
    "pyrefly>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for workflows",
    "slow: Slow running tests",
    "benchmark: Performance benchmark tests",
]

[tool.pyrefly]
python-version = "3.9.0"
preset = "legacy"
search-path = ["."]
